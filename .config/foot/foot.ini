# foot — terminale
#
#   Documentazione   `man 5 foot.ini`
#   Ricarica         basta aprire un nuovo terminale
#
# Ciò che non è impostato qui (colori compresi) mantiene il valore
# predefinito di foot.

# Sezione delle opzioni generali. Ne esistono altre: [colors], [cursor],
# [key-bindings], ...
[main]

# Font e dimensione in punti. Altri font, separati da virgole, fanno da
# ripiego per i glifi mancanti.
font=JetBrainsMono Nerd Font:size=11
