# foot — terminal emulator. Docs: `man 5 foot.ini`
# Everything not set here keeps foot's default (colours included). Changes
# apply to newly opened terminals.

# [main] is the section for general options; others exist ([colors],
# [cursor], [key-bindings], ...).
[main]
# Font family and size in points. More fonts can follow, separated by commas,
# as fallbacks for missing glyphs.
font=JetBrainsMono Nerd Font:size=11
