# foot — emulatore di terminale. Documentazione: `man 5 foot.ini`
# Tutto ciò che non è impostato qui mantiene il valore predefinito di foot
# (colori compresi). Le modifiche valgono per i terminali aperti da quel
# momento in poi.

# [main] è la sezione delle opzioni generali; ne esistono altre ([colors],
# [cursor], [key-bindings], ...).
[main]
# Famiglia e dimensione del font, in punti. Possono seguire altri font,
# separati da virgole, come ripiego per i glifi mancanti.
font=JetBrainsMono Nerd Font:size=11
