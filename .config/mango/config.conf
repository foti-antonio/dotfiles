# mangowm — configurazione minimale
# Documentazione: https://mangowm.github.io/docs/
#
# Sintassi: una `opzione=valore` per riga. I commenti iniziano con `#` e vanno
# su una riga a sé (i commenti in coda a un valore non sono documentati, quindi
# meglio evitarli).
# Controllare gli errori di questo file senza applicarlo:
#   mango -c config.conf -p
# Applicare le modifiche: SUPER+SHIFT+r (mango ricarica anche da solo quando il
# file viene salvato). Tutto ciò che non è impostato qui mantiene il valore
# predefinito di mango; l'elenco completo delle opzioni con i valori
# predefiniti è in /etc/mango/config.conf.

# ── Monitor ─────────────────────────────────────────────────
# monitor_rule=name:<regex>,<campo>:<valore>,...
# `name` è un'espressione regolare confrontata con il nome dell'uscita, quindi
# ^eDP-1$ significa "esattamente eDP-1" (il pannello integrato del portatile).
# Elencare le uscite con `mmsg get all-monitors`.
# scale:2.0 disegna tutto a dimensione doppia (HiDPI): un pannello 2880x1800
# si comporta così come un desktop 1440x900.
# Altri campi: width, height, refresh, x, y (posizione), rr (rotazione 0-7),
# vrr (0/1).
monitor_rule=name:^eDP-1$,scale:2.0

# ── Avvio automatico ────────────────────────────────────────
# exec_once esegue un comando una sola volta, all'avvio di mango. (`exec` lo
# rieseguirebbe a ogni ricaricamento della configurazione.)

# Comunica a systemd e D-Bus quale display Wayland e quale desktop usa questa
# sessione. I servizi che avviano su richiesta (xdg-desktop-portal per la
# condivisione dello schermo e i selettori di file, per esempio) non riescono
# a trovare la sessione senza queste variabili.
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# Barra di stato (~/.config/waybar).
exec_once=waybar
# Demone delle notifiche (~/.config/mako).
exec_once=mako
# Sfondo: se wallpaper.jpg esiste, lo mostra ridimensionato in modo da coprire
# lo schermo (-m fill), altrimenti dipinge un colore pieno (-c).
exec_once=sh -c '[ -f ~/.config/mango/wallpaper.jpg ] && swaybg -m fill -i ~/.config/mango/wallpaper.jpg || swaybg -c 1d2021'

# ── Aspetto (leggero per la GPU) ────────────────────────────
# Sfoca ciò che sta dietro le finestre trasparenti. 0 = spento. L'effetto più
# costoso.
blur=0
# Ombre sotto le finestre. 0 = spento.
shadows=0
# Arrotondamento degli angoli delle finestre, in pixel. 0 = angoli squadrati.
border_radius=4
# Spessore del bordo attorno a ogni finestra, in pixel.
border_px=2
# Spazi, in pixel. "inner" è lo spazio tra due finestre, "outer" lo spazio tra
# le finestre e il bordo dello schermo. Horizontal = sinistra/destra,
# vertical = sopra/sotto.
gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=8
gap_outer_vertical=8

# I colori sono 0xRRGGBBAA: rosso, verde, blu, alfa (ff = opaco).
# La palette è gruvbox dark, condivisa con waybar, mako e rofi.
# Sfondo dietro a tutto; visibile solo dove non è disegnato alcuno sfondo.
root_color=0x1d2021ff
# Bordo delle finestre senza focus.
border_color=0x3c3836ff
# Bordo della finestra con il focus.
focus_color=0xa89984ff
# Bordo di una finestra che richiede attenzione (es. una chat con un nuovo
# messaggio).
urgent_color=0xcc241dff
# Bordo delle finestre tenute nello scratchpad (un deposito di finestre
# nascosto e richiamabile; in questa configurazione nessun tasto vi è
# associato).
scratchpad_color=0x458588ff
# Bordo delle finestre massimizzate (togglemaximizescreen; non associato in
# questa configurazione).
maximized_screen_color=0x689d6aff

# ── Animazioni (brevi) ──────────────────────────────────────
# Interruttore generale delle animazioni delle finestre. 0 = tutto è
# istantaneo.
animations=1
# Animazioni delle superfici "layer": rofi, le notifiche di mako, la barra.
# 0 = spento, così il launcher e le notifiche compaiono all'istante.
layer_animations=0
# Come una finestra compare / scompare: slide, zoom, fade o none.
animation_type_open=slide
animation_type_close=slide
# Durate in millisecondi.
# open/close: una finestra che compare / scompare.
animation_duration_open=180
animation_duration_close=150
# move: le finestre che scivolano verso una nuova posizione o dimensione quando
# il layout cambia.
animation_duration_move=180
# tag: il passaggio da un tag all'altro.
animation_duration_tag=180
# focus: transizione al cambio di focus. 0 = nessuna.
animation_duration_focus=0

# ── Layout: scroller ────────────────────────────────────────
# Il layout scroller dispone le finestre una accanto all'altra su una striscia
# orizzontale senza fine (come niri o PaperWM): le nuove finestre non
# rimpiccioliscono le altre, la striscia scorre per mostrare quella con il
# focus.

# Larghezza di una nuova finestra, come frazione dello schermo (0.8 = 80%).
scroller_default_proportion=0.8
# Larghezza di una finestra quando è l'unica sul suo tag (1.0 = larghezza
# piena).
scroller_default_proportion_single=1.0
# Larghezze tra cui alterna SUPER+r.
scroller_proportion_preset=0.5,0.8,1.0
# 1 = tiene sempre la finestra con il focus al centro dello schermo.
# 0 = scorre solo quanto basta per renderla visibile.
scroller_focus_center=0
# tag_rule=id:<tag>,layout_name:<layout> sceglie il layout di ogni tag.
# Layout: tile, scroller, monocle, grid, deck, center_tile, vertical_tile,
# right_tile, vertical_scroller, dwindle, ...
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# ── Input ───────────────────────────────────────────────────
# Layout di tastiera (nome XKB: us, it, de, ...). Se ne possono elencare più
# di uno, separati da virgole. I nomi dei tasti nelle scorciatoie qui sotto
# sono risolti rispetto a questo layout.
xkb_rules_layout=us
# Tenendo premuto un tasto: attende repeat_delay millisecondi, poi lo ripete
# repeat_rate volte al secondo.
repeat_rate=25
repeat_delay=600
# 1 = il focus segue il mouse: la finestra sotto il puntatore riceve il focus
# senza bisogno di un clic.
sloppy_focus=1
# 1 = quando il focus cambia da tastiera, sposta il puntatore al centro della
# finestra che ha appena ricevuto il focus (impedisce a sloppy_focus di
# riprendersi il focus).
warp_cursor=1
# Dimensione del puntatore del mouse, in pixel.
cursor_size=24
# Touchpad: un tocco leggero vale come un clic.
tap_to_click=1
# Touchpad: lo ignora mentre si scrive, così un palmo appoggiato non sposta il
# puntatore.
# Le opzioni del touchpad possono richiedere un logout/login per avere effetto.
trackpad_disable_while_typing=1

# ── Regole delle finestre ───────────────────────────────────
# window_rule=IMPOSTAZIONE:VALORE,...,app_id:REGEX — impostazioni applicate a
# ogni nuova finestra il cui app id corrisponde alla regex
# (`mmsg get all-clients` elenca l'app id di ogni finestra aperta).
# I menu Wi-Fi e Bluetooth aperti dalla barra (foot che esegue nmtui o
# bluetui): flottanti e 800x500 invece di entrare nel layout scroller.
window_rule=is_floating:1,width:800,height:500,app_id:^(nmtui|bluetui)$

# ── Scorciatoie da tastiera ─────────────────────────────────
# bind=MODIFICATORI,TASTO,COMANDO,PARAMETRI
#   MODIFICATORI  SUPER (il tasto Windows), CTRL, ALT, SHIFT, oppure NONE per
#                 un tasto da solo. Si combinano con +, es. SUPER+SHIFT.
#   TASTO         nome del tasto come stampato da `wev` (o `xev`).
#   COMANDO       cosa deve fare mango; i PARAMETRI dipendono dal comando.

# ── App / sessione ──────────────────────────────────────────
# spawn esegue un programma direttamente (senza shell, quindi niente pipe né
# $variabili).
# Terminale.
bind=SUPER,Return,spawn,foot
# Launcher delle app (due tasti per la stessa cosa).
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,space,spawn,rofi -show drun
# Browser.
bind=SUPER+SHIFT,Return,spawn,firefox
# Gestore file.
bind=SUPER+SHIFT,n,spawn,nautilus
# Chiude la finestra con il focus.
bind=SUPER,w,killclient,
# Esce da mango: termina l'intera sessione e chiude tutte le finestre.
bind=SUPER+SHIFT,e,quit
# Rilegge questo file.
bind=SUPER+SHIFT,r,reload_config

# ── Focus / spostamento ─────────────────────────────────────
# focusdir sposta il focus sulla finestra in quella direzione.
# Funzionano sia i tasti di vim (h j k l) sia le frecce.
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
# exchange_client scambia la finestra con il focus con quella vicina in quella
# direzione, cioè sposta la finestra lungo la striscia.
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

# ── Stato della finestra ────────────────────────────────────
# Schermo intero sì/no: la finestra copre tutto lo schermo, barra compresa.
bind=SUPER,f,togglefullscreen,
# Flottante sì/no: toglie la finestra dal layout, così può essere spostata e
# ridimensionata liberamente (vedi le scorciatoie del mouse in fondo).
bind=SUPER+SHIFT,space,togglefloating,
# Alterna la larghezza della finestra tra i valori di
# scroller_proportion_preset (50% → 80% → 100%).
bind=SUPER,r,switch_proportion_preset,
# Imposta direttamente la larghezza della finestra al 100% dello schermo.
bind=SUPER+SHIFT,f,set_proportion,1.0
# Panoramica sì/no: rimpicciolisce la vista per vedere tutte le finestre
# aperte e sceglierne una.
bind=SUPER,Tab,toggleoverview,

# ── Tag ─────────────────────────────────────────────────────
# I tag sono gli spazi di lavoro di mango (1-9).
# view,N,S mostra il tag N. tag,N,S manda la finestra con il focus al tag N e
# la segue lì. S è "synctag": 1 applicherebbe la stessa azione su ogni
# monitor, 0 solo su quello corrente.
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# ── Tasti multimediali ──────────────────────────────────────
# XF86Audio* sono i tasti del volume del portatile; NONE = nessun modificatore
# necessario.
# wpctl è lo strumento di PipeWire/WirePlumber per il volume.
# @DEFAULT_AUDIO_SINK@ è l'uscita corrente (altoparlanti/cuffie),
# @DEFAULT_AUDIO_SOURCE@ il microfono corrente.
# Alza il volume del 5%; -l 1.0 lo limita al 100%.
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
# Abbassa il volume del 5%.
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Attiva/disattiva il muto dell'uscita.
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Attiva/disattiva il muto del microfono.
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ── Tasti della luminosità ──────────────────────────────────
# brightnessctl modifica una retroilluminazione indicata per nome (-d);
# elencarle con `brightnessctl -l`. Il dispositivo è indicato esplicitamente
# perché questo MacBook ha due dispositivi "backlight" e quello scelto in
# automatico potrebbe essere la Touch Bar (appletb_backlight) invece dello
# schermo (gmux_backlight).
# Luminosità dello schermo su/giù del 5%.
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -d gmux_backlight set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -d gmux_backlight set 5%-
# Retroilluminazione della tastiera su/giù del 10%.
bind=NONE,XF86KbdBrightnessUp,spawn,brightnessctl -d :white:kbd_backlight set 10%+
bind=NONE,XF86KbdBrightnessDown,spawn,brightnessctl -d :white:kbd_backlight set 10%-

# ── Screenshot ──────────────────────────────────────────────
# spawn_shell esegue il comando tramite una shell, necessaria qui per | e
# $(...).
# Print: seleziona una regione con il mouse (slurp), la cattura (grim) e mette
# l'immagine negli appunti (wl-copy). Niente viene salvato su disco.
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | wl-copy
# Shift+Print: salva l'intero schermo in un file che prende il nome da data e
# ora. grim non crea la cartella: ~/Pictures/Screenshots deve già esistere.
bind=SHIFT,Print,spawn_shell,grim ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png

# ── Mouse ───────────────────────────────────────────────────
# mousebind=MODIFICATORI,PULSANTE,COMANDO,PARAMETRI
# Tenere premuto SUPER e trascinare con il pulsante sinistro per spostare una
# finestra, con il destro per ridimensionarla. (I pulsanti sinistro e destro
# non possono essere associati senza un modificatore.)
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
# axisbind=MODIFICATORI,DIREZIONE,COMANDO — la rotellina.
# SUPER + rotellina su/giù: va al tag precedente/successivo che contiene
# finestre, saltando quelli vuoti.
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
