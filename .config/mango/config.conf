# mangowm — minimal config
# Docs: https://mangowm.github.io/docs/
#
# Syntax: one `option=value` per line. Comments start with `#` and go on their
# own line (trailing comments after a value are not documented, so avoid them).
# Check this file for errors without applying it:  mango -c config.conf -p
# Apply changes: SUPER+SHIFT+r (mango also reloads by itself when the file is
# saved). Anything not set here keeps mango's default; the full list of options
# with their defaults is in /etc/mango/config.conf.

# ── Monitor ─────────────────────────────────────────────────
# monitor_rule=name:<regex>,<field>:<value>,...
# `name` is a regular expression matched against the output name, so ^eDP-1$
# means "exactly eDP-1" (the built-in laptop panel). List outputs with
# `mmsg get all-monitors`.
# scale:2.0 draws everything at twice the size (HiDPI): a 2880x1800 panel then
# behaves like a 1440x900 desktop.
# Other fields: width, height, refresh, x, y (position), rr (rotation 0-7),
# vrr (0/1).
monitor_rule=name:^eDP-1$,scale:2.0

# ── Autostart ───────────────────────────────────────────────
# exec_once runs a command once, when mango starts. (`exec` would run it again
# on every config reload.)

# Tell systemd and D-Bus which Wayland display and desktop this session uses.
# Services they start on demand (xdg-desktop-portal for screen sharing and file
# pickers, for example) cannot find the session without these variables.
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# Status bar (~/.config/waybar).
exec_once=waybar
# Notification daemon (~/.config/mako).
exec_once=mako
# Wallpaper: if wallpaper.jpg exists, show it scaled to cover the screen
# (-m fill), otherwise paint a solid colour (-c).
exec_once=sh -c '[ -f ~/.config/mango/wallpaper.jpg ] && swaybg -m fill -i ~/.config/mango/wallpaper.jpg || swaybg -c 1d2021'

# ── Look (light on the GPU) ─────────────────────────────────
# Blur what is behind transparent windows. 0 = off. The most expensive effect.
blur=0
# Drop shadows under windows. 0 = off.
shadows=0
# Rounding of window corners, in pixels. 0 = square corners.
border_radius=4
# Thickness of the border around each window, in pixels.
border_px=2
# Gaps, in pixels. "inner" is the space between two windows, "outer" the space
# between windows and the screen edge. Horizontal = left/right,
# vertical = top/bottom.
gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=8
gap_outer_vertical=8

# Colours are 0xRRGGBBAA: red, green, blue, alpha (ff = opaque).
# The palette is gruvbox dark, shared with waybar, mako and rofi.
# Background behind everything; visible only where no wallpaper is drawn.
root_color=0x1d2021ff
# Border of unfocused windows.
border_color=0x3c3836ff
# Border of the focused window.
focus_color=0xa89984ff
# Border of a window asking for attention (e.g. a chat with a new message).
urgent_color=0xcc241dff
# Border of windows kept in the scratchpad (a hidden, toggleable window stash;
# no key is bound to it in this config).
scratchpad_color=0x458588ff
# Border of maximized windows (togglemaximizescreen; not bound in this config).
maximized_screen_color=0x689d6aff

# ── Animations (short) ──────────────────────────────────────
# Master switch for window animations. 0 = everything is instant.
animations=1
# Animations for "layer" surfaces: rofi, mako notifications, the bar. 0 = off,
# so the launcher and notifications appear instantly.
layer_animations=0
# How a window appears / disappears: slide, zoom, fade or none.
animation_type_open=slide
animation_type_close=slide
# Durations in milliseconds.
# open/close: a window appearing / disappearing.
animation_duration_open=180
animation_duration_close=150
# move: windows sliding to a new position or size when the layout changes.
animation_duration_move=180
# tag: switching from one tag to another.
animation_duration_tag=180
# focus: transition when focus changes. 0 = none.
animation_duration_focus=0

# ── Layout: scroller ────────────────────────────────────────
# The scroller layout puts windows side by side on an endless horizontal strip
# (like niri or PaperWM): new windows do not shrink the others, the strip
# scrolls to show the focused one.

# Width of a new window, as a fraction of the screen (0.8 = 80%).
scroller_default_proportion=0.8
# Width of a window when it is the only one on its tag (1.0 = full width).
scroller_default_proportion_single=1.0
# Widths that SUPER+r cycles through.
scroller_proportion_preset=0.5,0.8,1.0
# 1 = always keep the focused window centred on screen.
# 0 = scroll only as far as needed to bring it into view.
scroller_focus_center=0
# tag_rule=id:<tag>,layout_name:<layout> picks the layout of each tag.
# Layouts: tile, scroller, monocle, grid, deck, center_tile, vertical_tile,
# right_tile, vertical_scroller, dwindle, ...
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# ── Input ───────────────────────────────────────────────────
# Keyboard layout (XKB name: us, it, de, ...). Several can be listed, separated
# by commas. Key names in the binds below are resolved against this layout.
xkb_rules_layout=us
# Holding a key: wait repeat_delay milliseconds, then repeat it repeat_rate
# times per second.
repeat_rate=25
repeat_delay=600
# 1 = focus follows the mouse: the window under the pointer gets focus without
# a click.
sloppy_focus=1
# 1 = when focus changes from the keyboard, jump the pointer to the centre of
# the newly focused window (keeps sloppy_focus from stealing focus back).
warp_cursor=1
# Mouse pointer size, in pixels.
cursor_size=24
# Touchpad: a light tap counts as a click.
tap_to_click=1
# Touchpad: ignore it while typing, so a resting palm does not move the pointer.
# Touchpad options may need a logout/login to take effect.
trackpad_disable_while_typing=1

# ── Window rules ────────────────────────────────────────────
# window_rule=SETTING:VALUE,...,app_id:REGEX — settings applied to every new
# window whose app id matches the regex (`mmsg get all-clients` lists the
# app id of every open window).
# The Wi-Fi and Bluetooth menus opened from the bar (foot running nmtui or
# bluetui): floating and 800x500 instead of joining the scroller layout.
window_rule=is_floating:1,width:800,height:500,app_id:^(nmtui|bluetui)$

# ── Key bindings ────────────────────────────────────────────
# bind=MODIFIERS,KEY,COMMAND,PARAMETERS
#   MODIFIERS  SUPER (the Windows key), CTRL, ALT, SHIFT, or NONE for a bare
#              key. Combine with +, e.g. SUPER+SHIFT.
#   KEY        key name as printed by `wev` (or `xev`).
#   COMMAND    what mango should do; PARAMETERS depend on the command.

# ── Apps / session ──────────────────────────────────────────
# spawn runs a program directly (no shell, so no pipes or $variables).
# Terminal.
bind=SUPER,Return,spawn,foot
# App launcher (two keys for the same thing).
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,space,spawn,rofi -show drun
# Browser.
bind=SUPER+SHIFT,Return,spawn,firefox
# File manager.
bind=SUPER+SHIFT,n,spawn,nautilus
# Close the focused window.
bind=SUPER,w,killclient,
# Exit mango: ends the whole session and closes every window.
bind=SUPER+SHIFT,e,quit
# Re-read this file.
bind=SUPER+SHIFT,r,reload_config

# ── Focus / move ────────────────────────────────────────────
# focusdir moves the focus to the window in that direction.
# Both vim keys (h j k l) and the arrow keys work.
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
# exchange_client swaps the focused window with its neighbour in that
# direction, i.e. it moves the window along the strip.
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

# ── Window state ────────────────────────────────────────────
# Fullscreen on/off: the window covers the whole screen, bar included.
bind=SUPER,f,togglefullscreen,
# Floating on/off: take the window out of the layout so it can be moved and
# resized freely (see the mouse binds at the bottom).
bind=SUPER+SHIFT,space,togglefloating,
# Cycle the window width through scroller_proportion_preset (50% → 80% → 100%).
bind=SUPER,r,switch_proportion_preset,
# Set the window width to 100% of the screen directly.
bind=SUPER+SHIFT,f,set_proportion,1.0
# Overview on/off: zoom out to see all open windows and pick one.
bind=SUPER,Tab,toggleoverview,

# ── Tags ────────────────────────────────────────────────────
# Tags are mango's workspaces (1-9).
# view,N,S shows tag N. tag,N,S sends the focused window to tag N and follows
# it there. S is "synctag": 1 would apply the same action on every monitor,
# 0 only on the current one.
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# ── Media keys ──────────────────────────────────────────────
# XF86Audio* are the volume keys of the laptop; NONE = no modifier needed.
# wpctl is the PipeWire/WirePlumber volume tool. @DEFAULT_AUDIO_SINK@ is the
# current output (speakers/headphones), @DEFAULT_AUDIO_SOURCE@ the current
# microphone.
# Volume up 5%; -l 1.0 caps it at 100%.
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
# Volume down 5%.
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Mute/unmute the output.
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Mute/unmute the microphone.
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ── Brightness keys ─────────────────────────────────────────
# brightnessctl changes a backlight by name (-d); list them with
# `brightnessctl -l`. The device is named explicitly because this MacBook has
# two "backlight" devices and the default pick could be the Touch Bar
# (appletb_backlight) instead of the screen (gmux_backlight).
# Screen brightness up/down 5%.
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -d gmux_backlight set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -d gmux_backlight set 5%-
# Keyboard backlight up/down 10%.
bind=NONE,XF86KbdBrightnessUp,spawn,brightnessctl -d :white:kbd_backlight set 10%+
bind=NONE,XF86KbdBrightnessDown,spawn,brightnessctl -d :white:kbd_backlight set 10%-

# ── Screenshots ─────────────────────────────────────────────
# spawn_shell runs the command through a shell, needed here for | and $(...).
# Print: select a region with the mouse (slurp), capture it (grim) and put the
# image in the clipboard (wl-copy). Nothing is saved to disk.
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | wl-copy
# Shift+Print: save the whole screen to a file named after the date and time.
# grim does not create the folder: ~/Pictures/Screenshots must already exist.
bind=SHIFT,Print,spawn_shell,grim ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png

# ── Mouse ───────────────────────────────────────────────────
# mousebind=MODIFIERS,BUTTON,COMMAND,PARAMETERS
# Hold SUPER and drag with the left button to move a window, with the right
# button to resize it. (The left and right buttons cannot be bound without a
# modifier.)
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
# axisbind=MODIFIERS,DIRECTION,COMMAND — the scroll wheel.
# SUPER + scroll up/down: go to the previous/next tag that has windows on it,
# skipping empty ones.
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
