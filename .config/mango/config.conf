# mangowm — minimal config. Old config: config.conf.bak
# Docs: https://github.com/DreamMaoMao/mango/wiki

# ── Autostart ───────────────────────────────────────────────
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec_once=waybar
exec_once=mako
exec_once=sh -c '[ -f ~/.config/mango/wallpaper.jpg ] && swaybg -m fill -i ~/.config/mango/wallpaper.jpg || swaybg -c 1d2021'

# ── Look (light on the GPU) ─────────────────────────────────
blur=0
shadows=0
border_radius=4
border_px=2
gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=8
gap_outer_vertical=8

root_color=0x1d2021ff
border_color=0x3c3836ff
focus_color=0xa89984ff
urgent_color=0xcc241dff
scratchpad_color=0x458588ff
maximized_screen_color=0x689d6aff

# ── Animations (short) ──────────────────────────────────────
animations=1
layer_animations=0
animation_type_open=slide
animation_type_close=slide
animation_duration_open=180
animation_duration_close=150
animation_duration_move=180
animation_duration_tag=180
animation_duration_focus=0

# ── Layout: scroller ────────────────────────────────────────
scroller_default_proportion=0.8
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0
scroller_focus_center=0
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# ── Input ───────────────────────────────────────────────────
xkb_rules_layout=it
repeat_rate=25
repeat_delay=600
sloppy_focus=1
warp_cursor=1
cursor_size=24
tap_to_click=1
trackpad_disable_while_typing=1

# ── Apps / session ──────────────────────────────────────────
bind=SUPER,Return,spawn,foot
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,space,spawn,rofi -show drun
bind=SUPER+SHIFT,Return,spawn,firefox
bind=SUPER+SHIFT,n,spawn,nautilus
bind=SUPER,w,killclient,
bind=SUPER+SHIFT,e,quit
bind=SUPER+SHIFT,r,reload_config

# ── Focus / move ────────────────────────────────────────────
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

# ── Window state ────────────────────────────────────────────
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,space,togglefloating,
bind=SUPER,r,switch_proportion_preset,
bind=SUPER+SHIFT,f,set_proportion,1.0
bind=SUPER,Tab,toggleoverview,

# ── Tags ────────────────────────────────────────────────────
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# ── Media keys ──────────────────────────────────────────────
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ── Screenshots ─────────────────────────────────────────────
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | wl-copy
bind=SHIFT,Print,spawn_shell,grim ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png

# ── Mouse ───────────────────────────────────────────────────
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
