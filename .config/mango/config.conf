# mangowm — configurazione minimale
#
#   Documentazione     https://mangowm.github.io/docs/
#   Tutte le opzioni   /etc/mango/config.conf (con i valori predefiniti)
#   Controllo errori   mango -c config.conf -p
#   Ricarica           SUPER+SHIFT+r (o automatica al salvataggio del file)
#
# Sintassi: una `opzione=valore` per riga. I commenti iniziano con `#` e
# stanno su una riga a sé, mai in coda a un valore.
# Ciò che non è impostato qui mantiene il valore predefinito di mango.

# ── Monitor ─────────────────────────────────────────────────
# monitor_rule=name:<regex>,<campo>:<valore>,...
#   name    regex sul nome dell'uscita: ^eDP-1$ = lo schermo del portatile
#           (elenco delle uscite: `mmsg get all-monitors`)
#   scale   2.0 = tutto a dimensione doppia (HiDPI): il pannello 2880x1800
#           si comporta come un desktop 1440x900
#   altri   width, height, refresh, x, y (posizione), rr (rotazione 0-7),
#           vrr (0/1)

monitor_rule=name:^eDP-1$,scale:2.0

# ── Avvio automatico ────────────────────────────────────────
# exec_once esegue il comando una sola volta, all'avvio di mango.
# (`exec` lo rieseguirebbe a ogni ricarica della configurazione.)

# Comunica a systemd e D-Bus il display Wayland e il desktop della sessione.
# Senza, i servizi avviati su richiesta non trovano la sessione (es.
# xdg-desktop-portal, per condivisione dello schermo e selettori di file).
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Barra di stato → ~/.config/waybar
exec_once=waybar

# Notifiche → ~/.config/mako
exec_once=mako

# Sfondo: wallpaper.jpg a tutto schermo (-m fill) se esiste, altrimenti un
# colore pieno (-c).
exec_once=sh -c '[ -f ~/.config/mango/wallpaper.jpg ] && swaybg -m fill -i ~/.config/mango/wallpaper.jpg || swaybg -c 1d2021'

# ── Aspetto ─────────────────────────────────────────────────
# Effetti spenti, per non pesare sulla GPU.

# Sfocatura dietro le finestre trasparenti (0 = spenta). L'effetto più
# pesante.
blur=0

# Ombre sotto le finestre (0 = spente).
shadows=0

# Angoli arrotondati delle finestre, in pixel (0 = squadrati).
border_radius=4

# Spessore del bordo delle finestre, in pixel.
border_px=2

# Spazi, in pixel.
#   inner   tra una finestra e l'altra
#   outer   tra le finestre e il bordo dello schermo
gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=8
gap_outer_vertical=8

# ── Colori ──────────────────────────────────────────────────
# Formato 0xRRGGBBAA (AA = opacità, ff = opaco).
# Palette gruvbox dark, la stessa di waybar, mako e rofi.

# Sfondo: si vede solo dove manca l'immagine di sfondo.
root_color=0x1d2021ff

# Bordo delle finestre senza focus.
border_color=0x3c3836ff

# Bordo della finestra con il focus.
focus_color=0xa89984ff

# Bordo di una finestra che richiede attenzione (es. nuovo messaggio in chat).
urgent_color=0xcc241dff

# Bordo delle finestre nello scratchpad, un deposito nascosto di finestre.
# (Nessun tasto associato in questa configurazione.)
scratchpad_color=0x458588ff

# Bordo delle finestre massimizzate con togglemaximizescreen.
# (Nessun tasto associato in questa configurazione.)
maximized_screen_color=0x689d6aff

# ── Animazioni ──────────────────────────────────────────────
# Brevi, per non rallentare.

# Interruttore generale (0 = tutto istantaneo).
animations=1

# Animazioni di rofi, notifiche e barra (0 = spente: compaiono all'istante).
layer_animations=0

# Come compare e scompare una finestra: slide, zoom, fade, none.
animation_type_open=slide
animation_type_close=slide

# Durate, in millisecondi.
#   open, close   una finestra compare / scompare
#   move          le finestre si spostano o cambiano dimensione
#   tag           passaggio da un tag all'altro
#   focus         cambio di focus (0 = nessuna animazione)
animation_duration_open=180
animation_duration_close=150
animation_duration_move=180
animation_duration_tag=180
animation_duration_focus=0

# ── Layout: scroller ────────────────────────────────────────
# Le finestre stanno affiancate su una striscia orizzontale senza fine (come
# in niri o PaperWM). Una nuova finestra non rimpicciolisce le altre: è la
# striscia a scorrere fino a quella con il focus.

# Larghezza di una nuova finestra, come frazione dello schermo (0.8 = 80%).
scroller_default_proportion=0.8

# Larghezza di una finestra quando è l'unica del tag (1.0 = tutto lo schermo).
scroller_default_proportion_single=1.0

# Larghezze tra cui si alterna con SUPER+r.
scroller_proportion_preset=0.5,0.8,1.0

# Posizione della finestra con il focus.
#   1   sempre al centro dello schermo
#   0   la striscia scorre solo quanto basta per renderla visibile
scroller_focus_center=0

# Layout di ogni tag: tag_rule=id:<tag>,layout_name:<layout>
# Altri layout: tile, monocle, grid, deck, center_tile, vertical_tile,
# right_tile, vertical_scroller, dwindle, ...
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# ── Input ───────────────────────────────────────────────────

# Layout di tastiera, nome XKB (us, it, de, ...). Più layout si separano con
# virgole. I nomi dei tasti nelle scorciatoie più sotto si riferiscono a
# questo layout.
xkb_rules_layout=us

# Tasto tenuto premuto: dopo repeat_delay millisecondi viene ripetuto
# repeat_rate volte al secondo.
repeat_rate=25
repeat_delay=600

# 1 = il focus segue il mouse: basta portare il puntatore su una finestra,
# senza clic.
sloppy_focus=1

# 1 = quando il focus cambia da tastiera, il puntatore salta al centro della
# nuova finestra (così sloppy_focus non riporta il focus su quella vecchia).
warp_cursor=1

# Dimensione del puntatore, in pixel.
cursor_size=24

# Touchpad: un tocco leggero vale come clic.
tap_to_click=1

# Touchpad: disattivato mentre si scrive, così il palmo non sposta il
# puntatore. (Le opzioni del touchpad possono richiedere un logout/login.)
trackpad_disable_while_typing=1

# ── Regole delle finestre ───────────────────────────────────
# window_rule=IMPOSTAZIONE:VALORE,...,app_id:REGEX
# Le impostazioni valgono per ogni nuova finestra il cui app id corrisponde
# alla regex. (App id delle finestre aperte: `mmsg get all-clients`)

# Menu Wi-Fi e Bluetooth aperti dalla barra (foot con nmtui o bluetui):
# flottanti, 800x500, fuori dal layout scroller.
window_rule=is_floating:1,width:800,height:500,app_id:^(nmtui|bluetui)$

# ── Scorciatoie da tastiera ─────────────────────────────────
# bind=MODIFICATORI,TASTO,COMANDO,PARAMETRI
#   MODIFICATORI   SUPER (tasto Windows), CTRL, ALT, SHIFT; si combinano
#                  con + (SUPER+SHIFT). NONE = nessun modificatore
#   TASTO          nome del tasto come lo stampa `wev` (o `xev`)
#   COMANDO        cosa fa mango; i PARAMETRI dipendono dal comando

# ── App e sessione ──────────────────────────────────────────
# spawn avvia un programma direttamente, senza shell (quindi niente pipe né
# $variabili).

# Terminale.
bind=SUPER,Return,spawn,foot

# Launcher delle app (due tasti equivalenti).
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,space,spawn,rofi -show drun

# Browser.
bind=SUPER+SHIFT,Return,spawn,firefox

# Gestore file.
bind=SUPER+SHIFT,n,spawn,nautilus

# Chiude la finestra con il focus.
bind=SUPER,w,killclient,

# Esce da mango: termina la sessione e chiude tutte le finestre.
bind=SUPER+SHIFT,e,quit

# Ricarica questo file.
bind=SUPER+SHIFT,r,reload_config

# ── Focus e spostamento ─────────────────────────────────────
# Direzioni: i tasti di vim (h j k l) oppure le frecce.

# Sposta il focus sulla finestra in quella direzione.
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# Scambia la finestra con quella vicina, cioè la sposta lungo la striscia.
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

# ── Stato della finestra ────────────────────────────────────

# Schermo intero sì/no: la finestra copre tutto, barra compresa.
bind=SUPER,f,togglefullscreen,

# Flottante sì/no: la finestra esce dal layout e si può spostare e
# ridimensionare liberamente (con il mouse: vedi in fondo al file).
bind=SUPER+SHIFT,space,togglefloating,

# Larghezza successiva tra quelle di scroller_proportion_preset
# (50% → 80% → 100%).
bind=SUPER,r,switch_proportion_preset,

# Larghezza al 100% dello schermo, direttamente.
bind=SUPER+SHIFT,f,set_proportion,1.0

# Panoramica sì/no: mostra tutte le finestre aperte per sceglierne una.
bind=SUPER,Tab,toggleoverview,

# ── Tag ─────────────────────────────────────────────────────
# I tag sono gli spazi di lavoro di mango (1-9).
# L'ultimo parametro è "synctag": 0 = solo sul monitor corrente, 1 = su tutti
# i monitor.

# Mostra il tag N.
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Manda la finestra con il focus al tag N e la segue.
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# ── Tasti del volume ────────────────────────────────────────
# wpctl è lo strumento di PipeWire/WirePlumber per il volume.
#   @DEFAULT_AUDIO_SINK@     l'uscita corrente (altoparlanti o cuffie)
#   @DEFAULT_AUDIO_SOURCE@   il microfono corrente
# NONE = il tasto funziona da solo, senza modificatori.

# Volume +5% (-l 1.0 = mai oltre il 100%).
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+

# Volume -5%.
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Muto sì/no.
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Muto del microfono sì/no.
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ── Tasti della luminosità ──────────────────────────────────
# brightnessctl regola la retroilluminazione del dispositivo indicato con -d
# (elenco: `brightnessctl -l`). Il nome è esplicito perché questo MacBook ha
# due dispositivi "backlight", e quello predefinito potrebbe essere la Touch
# Bar (appletb_backlight) invece dello schermo (gmux_backlight).

# Schermo ±5%.
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -d gmux_backlight set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -d gmux_backlight set 5%-

# Tastiera ±10%.
bind=NONE,XF86KbdBrightnessUp,spawn,brightnessctl -d :white:kbd_backlight set 10%+
bind=NONE,XF86KbdBrightnessDown,spawn,brightnessctl -d :white:kbd_backlight set 10%-

# ── Screenshot ──────────────────────────────────────────────
# spawn_shell esegue il comando in una shell: qui serve per | e $(...).

# Print: si seleziona una regione con il mouse (slurp), grim la cattura e
# wl-copy la mette negli appunti. Niente viene salvato su disco.
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | wl-copy

# Shift+Print: salva tutto lo schermo in un file con data e ora nel nome.
# La cartella ~/Pictures/Screenshots deve già esistere: grim non la crea.
bind=SHIFT,Print,spawn_shell,grim ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png

# ── Mouse ───────────────────────────────────────────────────
# mousebind=MODIFICATORI,PULSANTE,COMANDO,PARAMETRI
# axisbind=MODIFICATORI,DIREZIONE,COMANDO   (la rotellina)

# SUPER + trascinamento: con il pulsante sinistro sposta la finestra, con il
# destro la ridimensiona. (Questi due pulsanti richiedono sempre un
# modificatore.)
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# SUPER + rotellina: tag precedente / successivo tra quelli con finestre
# (i tag vuoti vengono saltati).
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
